<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resize 832×551</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .dropzone {
            width: 100%;
            max-width: 600px;
            border: 3px dashed #444;
            border-radius: 12px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #16213e;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #e94560;
            background: #1a1a3e;
        }
        .dropzone p {
            font-size: 1.1rem;
            color: #aaa;
        }
        .dropzone .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        input[type="file"] { display: none; }
        .preview {
            margin-top: 24px;
            display: none;
            text-align: center;
        }
        .preview img {
            max-width: 100%;
            max-height: 350px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .preview .label {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #888;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 32px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #c73650; }
        .btn:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .spinner {
            display: none;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .output-size {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #6c6;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Image Resize to 832×551</h1>
    <p class="subtitle">Center crop &amp; resize for Instructables</p>

    <div class="dropzone" id="dropzone">
        <div class="icon">📁</div>
        <p>Drag &amp; drop an image here, or click to browse</p>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="preview" id="preview">
        <img id="previewImg" src="" alt="Preview">
        <div class="label" id="previewLabel"></div>
    </div>

    <button class="btn" id="convertBtn" disabled>Convert &amp; Download</button>

    <div class="spinner" id="spinner">Processing...</div>
    <div class="output-size" id="outputSize"></div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');
        const previewLabel = document.getElementById('previewLabel');
        const convertBtn = document.getElementById('convertBtn');
        const spinner = document.getElementById('spinner');
        const outputSize = document.getElementById('outputSize');

        let selectedFile = null;

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            selectedFile = file;
            const url = URL.createObjectURL(file);
            previewImg.src = url;
            preview.style.display = 'block';
            previewLabel.textContent = `${file.name} (${file.width}×${file.height})`;
            dropzone.style.display = 'none';
            convertBtn.disabled = false;
            outputSize.style.display = 'none';
        }

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            spinner.style.display = 'block';
            outputSize.style.display = 'none';

            const formData = new FormData();
            formData.append('image', selectedFile);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });

                if (!res.ok) {
                    const err = await res.text();
                    alert('Error: ' + err);
                    return;
                }

                const blob = await res.blob();
                const downloadUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const name = selectedFile.name.replace(/\.[^.]+$/, '') + '_832x551.png';
                a.href = downloadUrl;
                a.download = name;
                a.click();
                URL.revokeObjectURL(downloadUrl);

                outputSize.textContent = 'Saved: ' + name + ' (832×551)';
                outputSize.style.display = 'block';
            } catch (err) {
                alert('Upload failed: ' + err.message);
            } finally {
                convertBtn.disabled = false;
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
